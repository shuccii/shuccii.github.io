version: 2
updates:
  # npm の依存。astro 本体と公式インテグレーションは1本のPRにまとめる。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # @astrojs/check は typescript ^5 || ^6 しか受け付けず、7 に上げると npm ci が失敗する。
      # @astrojs/check が TypeScript 7 に対応したら、この除外を外す。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions。SHA固定した uses: も、横のバージョンコメントを見て更新してくれる。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

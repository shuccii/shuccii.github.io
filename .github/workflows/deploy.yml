name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定では何の権限も与えず、必要なジョブにだけ最小限を付与する。
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 型チェック。デプロイとは独立に走らせて結果だけ見えるようにする。
  check:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Layout.astro のインラインスクリプトに型注釈がなく、現時点で97件のエラーが出る。
      # まずは件数を見えるようにするだけにして、デプロイは止めない。
      # エラーを解消したら continue-on-error を外して必須チェックにする。
      - name: Run astro check
        continue-on-error: true
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # ブラウザへ配信される公開値(publishable key)。Repository Variables へ移す案は
      # 監査指摘 #11 として保留中。ここを変えるとコメント欄が止まるので単独で対応する。
      PUBLIC_SUPABASE_URL: https://amqicgnuahpxjurstojz.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_A2Z0V9Sj-se0zRkqZa4T4g_SPo0cO_b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with Astro
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          node-version: 22

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # main へのPRでも検査とビルドを走らせ、マージ前に失敗に気づけるようにする(公開はしない)。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 既定では何の権限も与えず、必要なジョブにだけ最小限を付与する。
permissions: {}

# 公開は1本ずつ順番に。PRは公開と別の列にし、新しいpushが来たら古い検査を止める。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # セキュリティ回帰テストと型チェックを公開前に必須にする。
  check:
    name: Security and type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run security regression tests
        run: npm run test:security
      - name: Run astro check
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # ブラウザへ配信される公開値(publishable key)。Repository Variables へ移す案は
      # 監査指摘 #11 として保留中。ここを変えるとコメント欄が止まるので単独で対応する。
      PUBLIC_SUPABASE_URL: https://amqicgnuahpxjurstojz.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_A2Z0V9Sj-se0zRkqZa4T4g_SPo0cO_b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 22

  deploy:
    name: Deploy
    needs: [build, check]
    # 公開は main だけ。PRでは検査とビルドで止める。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
